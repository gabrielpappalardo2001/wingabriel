<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800" role="img" aria-labelledby="t d">
  <title id="t">WinGabriel</title>
  <desc id="d">Logo di WinGabriel: su sfondo blu notte, un tasto con due frecce, su e giù, e tre onde sonore che rappresentano la voce. Sotto, il nome WinGabriel.</desc>
  <defs>
    <linearGradient id="sfondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B4DB3"/>
      <stop offset="1" stop-color="#0B1F4A"/>
    </linearGradient>
  </defs>
  <rect x="40" y="40" width="720" height="720" rx="150" fill="url(#sfondo)"/>
  <!-- tasto -->
  <rect x="170" y="150" width="270" height="360" rx="56" fill="#FFFFFF"/>
  <rect x="190" y="170" width="230" height="320" rx="40" fill="none" stroke="#0B1F4A" stroke-opacity="0.18" stroke-width="6"/>
  <!-- freccia su -->
  <path d="M245 295 L305 225 L365 295" fill="none" stroke="#0B1F4A" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- freccia giù -->
  <path d="M245 365 L305 435 L365 365" fill="none" stroke="#F2A900" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- onde sonore -->
  <path d="M500 270 Q550 330 500 390" fill="none" stroke="#FFFFFF" stroke-width="34" stroke-linecap="round"/>
  <path d="M555 215 Q650 330 555 445" fill="none" stroke="#FFFFFF" stroke-width="34" stroke-linecap="round"/>
  <path d="M610 160 Q750 330 610 500" fill="none" stroke="#F2A900" stroke-width="34" stroke-linecap="round"/>
  <!-- nome -->
  <text x="400" y="655" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="108" font-weight="700" fill="#FFFFFF">Win<tspan fill="#F2A900">Gabriel</tspan></text>
</svg>
